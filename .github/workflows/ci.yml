name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --no-fund
      - run: npm run audit
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: goldens unchanged
        run: git diff --exit-code tests/golden
